<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Romina 🌻</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; overflow-x: hidden; color: #fff;
    }
    .container { text-align: center; z-index: 2; padding: 20px; }
    h1 {
      font-size: 2.2rem; color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); margin-bottom: 25px;
    }
    .sunflower {
      position: relative; width: 180px; height: 180px; margin: 20px auto;
      animation: pulse 3s infinite ease-in-out;
    }
    .center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 70px; height: 70px; background: radial-gradient(circle, #3d2314 0%, #1c0d02 100%);
      border-radius: 50%; z-index: 10;
    }
    .petals {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      animation: spin 20s linear infinite;
    }
    .petal {
      position: absolute; top: 50%; left: 50%; width: 28px; height: 80px;
      background: linear-gradient(to top, #ff8c00, #ffd700);
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      transform-origin: center bottom;
    }
    .stem {
      width: 12px; height: 140px; background: #2e7d32; margin: 0 auto; border-radius: 6px;
    }
    .falling-petal {
      position: absolute; background: #ffd700; border-radius: 50% 0 50% 50%;
      opacity: 0.8; pointer-events: none; animation: fall linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Para tí Romina, disfruta mucho este día. 🌻</h1>
    <div class="sunflower">
      <div class="petals" id="petalsContainer"></div>
      <div class="center"></div>
    </div>
    <div class="stem"></div>
  </div>
  <script>
    const container = document.getElementById('petalsContainer');
    for (let i = 0; i < 16; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.transform = `translate(-50%, -100%) rotate(${(360/16)*i}deg)`;
      container.appendChild(petal);
    }
    function createFallingPetal() {
      const petal = document.createElement('div');
      petal.className = 'falling-petal';
      const size = Math.random() * 15 + 10;
      petal.style.width = size + 'px';
      petal.style.height = (size * 1.5) + 'px';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 6000);
    }
    setInterval(createFallingPetal, 200);
  </script>
</body>
</html>
